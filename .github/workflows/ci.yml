name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (offline, no model download)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint
        run: |
          pip install ruff
          ruff check . --output-format=github

      - name: Unit + integration tests
        # The hashing encoder and the mock judge mean no model download, no GPU
        # and no network. If this ever needs a network call, that is a bug in the
        # fixtures, not a missing secret.
        env:
          LDM_EMBEDDING_BACKEND: hashing
          LDM_JUDGE_PROVIDER: mock
        run: pytest -q --junitxml=junit.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit
          path: junit.xml

  judge-gate:
    name: Judge regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The point of the gate: a judge model or rubric change that stops catching
    # the safety and hallucination cases is a regression, not an improvement.
    # The existence check is a step rather than a job-level `if` so the job
    # always reports a status and the "nothing to compare" case is explicit
    # rather than an invisible skip.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Is there a judge baseline to compare against?
        id: has_baseline
        run: |
          if [ -f artifacts/judge_regression.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No stored judge baseline. Run scripts/eval_judge.py --rebaseline to create one."
          fi

      - name: Evaluate the judge against the golden suite
        if: steps.has_baseline.outputs.present == 'true'
        env:
          LDM_JUDGE_PROVIDER: mock
        run: |
          set +e
          python scripts/eval_judge.py
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "::warning::Judge signature or rubric changed; re-baseline deliberately (--rebaseline)."
            exit 0
          fi
          exit "$code"

  demo-smoke:
    name: Demo smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the production-shift demo (offline mode)
        env:
          LDM_EMBEDDING_BACKEND: hashing
          LDM_JUDGE_PROVIDER: mock
        run: python scripts/demo_shift.py --fast --reset

      - name: Reports were produced
        run: |
          test -n "$(ls data/reports/*.html 2>/dev/null)"
          test -n "$(ls data/reports/*.json 2>/dev/null)"
          echo "OK: reports written"

      - name: Upload the report
        uses: actions/upload-artifact@v4
        with:
          name: drift-report
          path: data/reports/*.html

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -t llm-drift-monitor:ci .

      - name: Smoke-test the container's importability
        run: |
          docker run --rm --entrypoint python llm-drift-monitor:ci -c \
            "import src.api.server, src.monitoring, src.judge; print('imports ok')"
